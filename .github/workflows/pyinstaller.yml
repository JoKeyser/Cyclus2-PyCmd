name: Build PyInstaller executables

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'  # only match SemVer tags
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid tag format: $TAG" >&2
            exit 1
          fi

      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION=$(tr -d '\r\n' < VERSION)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: python -m PyInstaller Cyclus2-PyCmd.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cyclus2-PyCmd-${{ steps.version.outputs.version }}-${{ runner.os }}
          path: dist/**
          if-no-files-found: error
